# Development stack: PostgreSQL + Redis + FastAPI + Celery worker + Next.js
#
#   cp .env.example .env      # fill in the secrets (this file is git-ignored)
#   docker compose up --build
#   docker compose --profile mail up --build   # also start Mailpit (local test inbox, http://localhost:8025)
#
# Frontend: http://localhost:3000   API: http://localhost:8000/docs   Health: http://localhost:8000/health
#
# Docker is optional: local development without Docker keeps working (see README).

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: email_agent
      POSTGRES_USER: email_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5433:5432" # 5433 on the host to avoid clashing with a local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_agent -d email_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &backend-env
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://email_agent:${POSTGRES_PASSWORD}@db:5432/email_agent
      REDIS_URL: redis://redis:6379/0
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-celery}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      LLM_FALLBACK_TO_MOCK: ${LLM_FALLBACK_TO_MOCK:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      SMTP_ALLOW_PRIVATE_HOSTS: ${SMTP_ALLOW_PRIVATE_HOSTS:-false}
      # Gmail OAuth (optional; values come from the git-ignored root .env). The redirect URI is the
      # host-visible backend URL, which the published port 8000 maps onto this container.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/oauth/gmail/callback}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    # Same image as the backend; runs the Celery worker that delivers queued emails.
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "-Q", "email", "--concurrency=2"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy # the backend applies the migrations first
    environment: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 20s

  mailpit:
    # Optional local SMTP catcher for testing delivery without sending real email.
    # Enable with --profile mail. Its SMTP host (mailpit:1025) is a private address, so
    # set SMTP_ALLOW_PRIVATE_HOSTS=true for that session (never in production).
    image: axllent/mailpit:latest
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "8025:8025" # web inbox
      - "1025:1025" # SMTP

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the API directly, so this is the host-visible URL.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  pgdata:
